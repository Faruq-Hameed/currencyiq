name: Cron - Cleanup Old Rates

on:
  schedule:
    - cron: '0 3 1 */3 *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/cleanup-rates
        run: |
          curl -sf -X GET "${{ secrets.BACKEND_URL }}/api/v1/internal/cron/cleanup-rates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
