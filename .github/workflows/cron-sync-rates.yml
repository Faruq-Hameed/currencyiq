name: Cron - Sync Rates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/sync-rates
        run: |
          curl -sf -X GET "${{ secrets.BACKEND_URL }}/api/v1/internal/cron/sync-rates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
