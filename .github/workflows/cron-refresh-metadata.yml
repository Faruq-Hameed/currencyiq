name: Cron - Refresh Currency Metadata

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/refresh-metadata
        run: |
          curl -sf -X GET "${{ secrets.BACKEND_URL }}/api/v1/internal/cron/refresh-metadata" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
