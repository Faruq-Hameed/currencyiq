name: Cron - Check Provider Health

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/check-health
        run: |
          curl -sf -X GET "${{ secrets.BACKEND_URL }}/api/v1/internal/cron/check-health" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
